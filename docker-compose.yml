# Plataforma de desarrollo de TrackFlow.
# Desde la raíz:  docker compose up
#   Website:    http://localhost:3000
#   Backoffice: http://localhost:3001
#   enITma:     http://localhost:3002  (Aviation & Space + Space AI)
#   Backend:    http://localhost:8000  (docs en /docs)
#
# Las variables provienen de .env (ver .env.example). No hay secretos.

services:
  backend:
    build:
      context: ./services
    container_name: trackflow-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Código del backend para hot reload de Uvicorn (--reload).
      - ./services/api:/app/api
      # Paquete de lógica compartida que la API importa (incident_analysis).
      - ./packages/incident-analysis:/shared/incident-analysis
    networks:
      - trackflow-network
    healthcheck:
      # Usa el endpoint /health ya existente en la API.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  interfaces:
    build:
      context: ./uis
    container_name: trackflow-interfaces
    env_file:
      - .env
    environment:
      # URLs que usa el NAVEGADOR (host) para llegar al backend. Son públicas
      # (NEXT_PUBLIC_*) y no contienen secretos. Se resuelven desde el host, por
      # eso apuntan a localhost y NO al hostname interno "backend".
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:-http://localhost:8000}
      # URLs de las apps del proyecto, para la navegación cruzada entre ellas.
      # Son públicas (las resuelve el navegador en el host); no contienen secretos.
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BACKOFFICE_URL: ${NEXT_PUBLIC_BACKOFFICE_URL:-http://localhost:3001}
      NEXT_PUBLIC_TALENT_URL: ${NEXT_PUBLIC_TALENT_URL:-http://localhost:3002}
      # Hot reload fiable en Docker Desktop/macOS (file watching por polling).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
      - "${BACKOFFICE_PORT:-3001}:3001"
    volumes:
      # Bind mount del código de interfaces para hot reload…
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      # …pero preservando los node_modules instalados en la imagen (volúmenes
      # anónimos que "tapan" los del host y evitan que el bind mount los borre).
      - /app/website/node_modules
      - /app/backoffice/node_modules
      # También el .next del backoffice queda en el contenedor (no en el host).
      - /app/backoffice/.next
    depends_on:
      - backend
    networks:
      - trackflow-network

  # Plataforma enITma (Next.js: Home + API del asistente enITma Space AI).
  enitma:
    build:
      context: ./uis/enitma
    container_name: trackflow-enitma
    environment:
      # El asistente usa el proveedor local "mock" por defecto (sin credenciales).
      # Para conectar OpenAI, define estas variables en un .env del servidor
      # (nunca en el repo). Si OPENAI_API_KEY no está, el provider cae al mock.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${ENITMA_PORT:-3002}:3002"
    volumes:
      - ./uis/enitma:/app
      - /app/node_modules
      - /app/.next
    networks:
      - trackflow-network

networks:
  trackflow-network:
    name: trackflow-network
    driver: bridge
